# conf/new_loss_kfold.yaml
# 基于 new_loss 配置运行 K-fold cross-validation

defaults:
  - new_loss
  - _self_

# 评估协议
# independent_test: 原来的 train-test / independent test
# cross_validation: 对 triplets.csv 做 K 折交叉验证
eval_protocol: cross_validation

# K 折参数
n_splits: 5
random_state: 42

# 建议先关闭 wandb，确认能正常跑通后再打开
use_wandb: false
wandb_name_prefix: new_loss_kfold

# 数据目录仍然使用原来的 dataset
# 交叉验证会在 triplets.csv 内部划分，
# 不使用 drugbank_triplets.csv 作为测试集
data_dir: ./dataset