defaults:
  - default
  - _self_

wandb_name_prefix: qccl_lite
# 推荐：QCCL v2-lite 最小可复现配置
# 特点：多正样本 + 伪负抑制 + 基础难负重加权

alpha: 0.45
learning_rate: 0.004

qccl_temperature: 0.25
qccl_gene_query_temperature: -1.0
qccl_drug_query_temperature: -1.0
qccl_disease_query_temperature: -1.0
qccl_asymmetric_norm_mode: symmetric

qccl_multi_positive: true
qccl_hardness_reweight: true
qccl_hardness_alpha: 0.6
qccl_hardness_temperature: 0.8
qccl_query_hardness_reweight: false

qccl_three_pool_schedule: false
qccl_memory_queue: false

# QCCL module ablation knobs
qccl_cond_dim_ratio: 0.5
qccl_num_layers: 2
qccl_query_dropout: 0.25
qccl_film_layer_norm: false
